<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <style>
      .window-top-dot { fill: #ffffff; rx: 4px; }
      .bar { fill: #2d5570; }
      .grid-line { stroke: #2a3d52; stroke-width: 4; stroke-linecap: round; }
      .grid-cell { fill: #6f8fa8; }
    </style>
  </defs>

  <!-- 1. Background Window (Top-Center: Pie Chart) -->
  <g id="window-back">
    <!-- Window Frame -->
    <rect x="250" y="200" width="310" height="230" rx="20" fill="#3f6685" />
    <!-- Window Header Dots -->
    <rect x="468" y="218" width="16" height="14" rx="4" class="window-top-dot" />
    <rect x="496" y="218" width="16" height="14" rx="4" class="window-top-dot" />
    <rect x="524" y="218" width="16" height="14" rx="4" class="window-top-dot" />
    <!-- Canvas Area -->
    <rect x="262" y="246" width="286" height="172" rx="10" fill="#678fae" />

    <!-- Pie Chart -->
    <g transform="translate(425, 335)">
      <!-- Circle Base / Light Slice -->
      <circle r="72" fill="#afd3de" />
      <!-- Dark Pie Sector (Top-Right: ~0 to 110 deg) -->
      <path d="M 0 0 L 0 -72 A 72 72 0 0 1 68 25 Z" fill="#2d4e68" />
      <!-- Medium Pie Sector (Bottom-Right) -->
      <path d="M 0 0 L 68 25 A 72 72 0 0 1 20 69 Z" fill="#4d7491" />
    </g>
  </g>

  <!-- 2. Left Window (Foreground-Left: Bar Chart) -->
  <g id="window-left">
    <!-- Window Frame Outer Border -->
    <rect x="116" y="296" width="268" height="232" rx="22" fill="#23506d" />
    <!-- Window Inner Header Area -->
    <rect x="126" y="306" width="248" height="212" rx="14" fill="#3f728f" />
    <!-- Header Dots -->
    <rect x="294" y="318" width="14" height="13" rx="3.5" class="window-top-dot" />
    <rect x="318" y="318" width="14" height="13" rx="3.5" class="window-top-dot" />
    <rect x="342" y="318" width="14" height="13" rx="3.5" class="window-top-dot" />
    <!-- Canvas Area -->
    <rect x="128" y="342" width="244" height="172" rx="8" fill="#7ba3b5" />

    <!-- Chart Elements -->
    <line x1="148" y1="488" x2="350" y2="488" stroke="#244d66" stroke-width="6" stroke-linecap="round" />
    <!-- Bar 1 -->
    <rect x="160" y="430" width="30" height="58" rx="2" class="bar" />
    <!-- Bar 2 -->
    <rect x="202" y="392" width="28" height="96" rx="2" class="bar" />
    <!-- Bar 3 -->
    <rect x="242" y="410" width="27" height="78" rx="2" class="bar" />
    <!-- Bar 4 (Accent Dark) -->
    <rect x="281" y="368" width="28" height="120" rx="2" fill="#213854" />
  </g>

  <!-- 3. Right Window (Foreground-Right: Table/Spreadsheet) -->
  <g id="window-right">
    <!-- Window Frame Outer Border -->
    <rect x="424" y="356" width="252" height="216" rx="20" fill="#203348" />
    <!-- Window Inner Header Area -->
    <rect x="434" y="366" width="232" height="196" rx="12" fill="#3d5168" />
    <!-- Header Dots -->
    <rect x="588" y="374" width="14" height="13" rx="3.5" class="window-top-dot" />
    <rect x="614" y="374" width="14" height="13" rx="3.5" class="window-top-dot" />
    <rect x="640" y="374" width="14" height="13" rx="3.5" class="window-top-dot" />
    <!-- Canvas Area -->
    <rect x="440" y="398" width="220" height="158" rx="8" fill="#586f87" />

    <!-- Table Container / Header Row -->
    <rect x="456" y="426" width="188" height="26" fill="#1b2a3a" rx="4" />
    <!-- Grid Cells Background -->
    <rect x="456" y="452" width="188" height="88" fill="#7593ab" rx="3" />
    <!-- Left Column Shading -->
    <rect x="456" y="452" width="64" height="44" fill="#33465c" />
    <rect x="456" y="496" width="64" height="44" fill="#29394c" />

    <!-- Table Grid Lines -->
    <line x1="456" y1="452" x2="644" y2="452" class="grid-line" />
    <line x1="456" y1="474" x2="644" y2="474" class="grid-line" />
    <line x1="456" y1="496" x2="644" y2="496" class="grid-line" />
    <line x1="456" y1="518" x2="644" y2="518" class="grid-line" />
    <line x1="456" y1="540" x2="644" y2="540" class="grid-line" />

    <line x1="456" y1="426" x2="456" y2="540" class="grid-line" />
    <line x1="520" y1="452" x2="520" y2="540" class="grid-line" />
    <line x1="560" y1="452" x2="560" y2="540" class="grid-line" />
    <line x1="602" y1="452" x2="602" y2="540" class="grid-line" />
    <line x1="644" y1="426" x2="644" y2="540" class="grid-line" />
  </g>

  <!-- 4. Big Checkmark with Thick White Border -->
  <g id="checkmark">
    <!-- Outer White Silhouette/Stroke -->
    <path d="M 285 488 L 348 584 L 546 322 L 602 368 L 348 698 L 226 538 Z"
          fill="#ffffff"
          stroke="#ffffff"
          stroke-width="36"
          stroke-linejoin="round"
          stroke-linecap="round" />
    <!-- Inner Green Checkmark Body -->
    <path d="M 285 488 L 348 584 L 546 322 L 602 368 L 348 698 L 226 538 Z"
          fill="#3b9650"
          stroke="#3b9650"
          stroke-width="8"
          stroke-linejoin="round"
          stroke-linecap="round" />
  </g>
</svg>
